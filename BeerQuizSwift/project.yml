name: BeerQuiz
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: 5.0
targets:
  BeerQuiz:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BeerQuiz/App
      - path: BeerQuiz/Models
      - path: BeerQuiz/Services
      - path: BeerQuiz/Views
      - path: BeerQuiz/Assets.xcassets
      - path: BeerQuiz/Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: BeerQuiz/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.benkeicreate.beerquiz
        PRODUCT_MODULE_NAME: BeerQuiz
        PRODUCT_NAME: BeerQuiz
        TARGETED_DEVICE_FAMILY: "1,2"
  BeerQuizTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BeerQuizTests
    dependencies:
      - target: BeerQuiz
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.benkeicreate.beerquiz.tests
        PRODUCT_NAME: BeerQuizTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BeerQuiz.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BeerQuiz"
schemes:
  BeerQuiz:
    build:
      targets:
        BeerQuiz: all
    test:
      targets:
        - BeerQuizTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
